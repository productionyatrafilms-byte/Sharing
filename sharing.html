<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-lang-key="homeTitle"></title>

    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="./swiper-bundle.min.css">
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <style>
      main {
        opacity: 0;
        transform: translateY(15px);
        transition:
          opacity 1s ease,
          transform 1s ease;
        pointer-events: none;
      }

      body.page-visible main {
        opacity: 1;
        transform: translateY(0);
        pointer-events: auto;
      }

      /* ---------- intro video button + popup (theme-matched) ---------- */

      body.video-open main {
        filter: blur(0.45vw);
        pointer-events: none;
        user-select: none;
      }

      .video-btn {
        position: fixed;
        bottom: 2.5vw;
        left: 3vw;
        z-index: 1000;
        opacity: 1;
        visibility: visible;
        transition:
          opacity 0.3s ease,
          visibility 0.3s ease;
      }

      .video-btn.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .start-video-btn {
        border: none;
        background-color: transparent;
        background-image: url("./assets/watch.png");
        background-position: center;
        background-repeat: no-repeat;
        background-size: contain;
        display: flex;
        align-items: center;
        justify-content: space-between;
        cursor: pointer;
        width: 14vw;
        height: 5vw;
        /* fixed in place — no press-down shift on click */
        transition:
          background 0.25s ease,
          box-shadow 0.25s ease;
      }

      /* no :active transform — button stays put on click */

      .start-text {
        font-size: 1.5vw;
        font-weight: 900;
        letter-spacing: 0.1vw;
        color: #7f5bd4;
        line-height: 1;
        text-align: end;
          font-family: "Myriad Pro";

        width: 100%;
        padding-right: 1vw;
        text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.3);
      }

      body[data-lang="hi"] .start-text {
        font-size: 1.5vw !important;
      }

      body[data-lang="gu"] .start-text {
        font-size: 1.5vw !important;
      }

      .video-popup {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.42);
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition:
          opacity 0.35s ease,
          visibility 0.35s ease;
      }

      .video-popup.active {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
      }

      .video-box {
        position: relative;
        width: 68vw;
        aspect-ratio: 16 / 9;
        border-radius: 2vw;
        background: rgba(103, 61, 194, 0.22);
        padding: 0.75vw;
        border: 0.25vw solid white;
        box-shadow: 0 1vw 3vw rgba(0, 0, 0, 0.45);
        transform: scale(0.82);
        opacity: 0;
        backdrop-filter: blur(0.25vw);
        -webkit-backdrop-filter: blur(0.25vw);
        transition:
          transform 0.4s cubic-bezier(0.22, 1, 0.36, 1),
          opacity 0.35s ease;
      }

      .video-popup.active .video-box {
        transform: scale(1);
        opacity: 1;
      }

      .popup-video-frame {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 1.4vw;
        overflow: hidden;
        background: #000;
        border: 0.18vw solid rgba(255, 255, 255, 0.75);
      }

      .popup-video {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
        background: #000;
      }

      .close-video-btn {
        position: absolute;
        top: -1.35vw;
        right: -1.35vw;
        width: 3.4vw;
        height: 3.4vw;
        border: none;
        border-radius: 50%;
        background: #ffffff;
        color: #673dc2;
        font-size: 1.8vw;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 10;
        box-shadow: 0 0.35vw 1vw rgba(0, 0, 0, 0.35);
        transition:
          transform 0.25s ease,
          background 0.25s ease,
          color 0.25s ease;
      }

      .close-video-btn i {
        width: 1.8vw;
        min-width: 1.8vw;
        max-width: 1.8vw;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .close-video-btn:hover {
        transform: rotate(90deg) scale(1.08);
        background: #673dc2;
        color: #ffffff;
      }

      .custom-controls {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 5;
        padding: 1vw;
        display: flex;
        flex-direction: column;
        gap: 0.75vw;
        background: linear-gradient(
          to top,
          rgba(0, 0, 0, 0.82),
          rgba(103, 61, 194, 0.5),
          rgba(103, 61, 194, 0)
        );
        opacity: 1;
        transition: opacity 0.25s ease;
      }

      .popup-video-frame.controls-hidden .custom-controls {
        opacity: 0;
        pointer-events: none;
      }

      .progress-wrap {
        width: 100%;
        display: flex;
        align-items: center;
      }

      .video-progress {
        width: 100%;
        appearance: none;
        -webkit-appearance: none;
        height: 0.45vw;
        border-radius: 5vw;
        background: rgba(255, 255, 255, 0.35);
        cursor: pointer;
        overflow: hidden;
        pointer-events: auto;
      }

      .video-progress::-webkit-slider-thumb {
        appearance: none;
        -webkit-appearance: none;
        width: 1vw;
        height: 1vw;
        border-radius: 50%;
        background: #ffffff;
        box-shadow: -70vw 0 0 69.6vw #ffffff;
        cursor: pointer;
      }

      .video-progress::-moz-range-thumb {
        width: 1vw;
        height: 1vw;
        border: none;
        border-radius: 50%;
        background: #ffffff;
        cursor: pointer;
      }

      .video-progress::-moz-range-progress {
        height: 0.45vw;
        border-radius: 5vw;
        background: #ffffff;
      }

      .control-row {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1vw;
      }

      .control-left,
      .control-right {
        display: flex;
        align-items: center;
        gap: 0.8vw;
      }

      .control-btn {
        width: 2.8vw;
        min-width: 2.8vw;
        max-width: 2.8vw;
        height: 2.8vw;
        border: none;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.24);
        color: #ffffff;
        font-size: 1.2vw;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition:
          background 0.25s ease,
          color 0.25s ease,
          transform 0.25s ease;
      }

      .control-btn:hover {
        background: #ffffff;
        color: #673dc2;
        transform: scale(1.08);
      }

      .control-btn i {
        width: 1.4vw;
        min-width: 1.4vw;
        max-width: 1.4vw;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .time-text {
        color: #ffffff;
        font-size: 1.05vw;
        font-weight: 700;
        font-family: Arial, sans-serif;
        letter-spacing: 0.05vw;
        min-width: 8vw;
      }

      .volume-range {
        width: 7vw;
        appearance: none;
        -webkit-appearance: none;
        height: 0.4vw;
        border-radius: 5vw;
        background: rgba(255, 255, 255, 0.35);
        cursor: pointer;
      }

      .volume-range::-webkit-slider-thumb {
        appearance: none;
        -webkit-appearance: none;
        width: 0.9vw;
        height: 0.9vw;
        border-radius: 50%;
        background: #ffffff;
        cursor: pointer;
      }

      .volume-range::-moz-range-thumb {
        width: 0.9vw;
        height: 0.9vw;
        border: none;
        border-radius: 50%;
        background: #ffffff;
        cursor: pointer;
      }

      .video-center-play {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 6vw;
        min-width: 6vw;
        max-width: 6vw;
        height: 6vw;
        border: 0.22vw solid rgba(255, 255, 255, 0.85);
        border-radius: 50%;
        background: rgba(103, 61, 194, 0.42);
        color: #ffffff;
        font-size: 2.2vw;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transform: translate(-50%, -50%) scale(1);
        z-index: 4;
        transition:
          opacity 0.25s ease,
          transform 0.25s ease,
          background 0.25s ease;
      }

      .video-center-play i {
        width: 2.2vw;
        min-width: 2.2vw;
        max-width: 2.2vw;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .video-center-play.hide {
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, -50%) scale(0.8);
      }

      .video-center-play:hover {
        background: rgba(103, 61, 194, 0.82);
        transform: translate(-50%, -50%) scale(1.08);
      }

      .video-box:fullscreen {
        width: 100%;
        height: 100%;
        border-radius: 0;
        padding: 0;
        background: #000;
      }

      .video-box:fullscreen .popup-video-frame {
        border-radius: 0;
        border: none;
      }

      .video-box:fullscreen .close-video-btn {
        top: 1.5vw;
        right: 1.5vw;
      }
    </style>
  </head>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        setTimeout(() => {
          document.body.classList.add("page-visible");
        }, 250);

        const swipeAudio = document.getElementById("swipeAudio");
        const popAudio = document.getElementById("popAudio");

        // dedicated click sound for the intro video buttons, same pattern as index.html
        const videoPlayClickSound = new Audio("./assets/audio/5.mp3");

        const prevBtn = document.querySelector(".swiper-button-prev");
        const nextBtn = document.querySelector(".swiper-button-next");
        const homeBtnLink = document.querySelector(".home-btn a");

        function playAudio(audio) {
          if (!audio) return;

          audio.pause();
          audio.currentTime = 0;

          audio.play().catch((err) => {
            console.log("Audio play failed:", err);
          });
        }

        function getSwiper() {
          return document.querySelector(".mySwiper")?.swiper;
        }

        prevBtn?.addEventListener(
          "click",
          (e) => {
            e.preventDefault();
            e.stopImmediatePropagation();

            playAudio(swipeAudio);

            const swiper = getSwiper();

            if (swiper && !swiper.isBeginning) {
              swiper.slidePrev();
            }
          },
          true,
        );

        nextBtn?.addEventListener(
          "click",
          (e) => {
            e.preventDefault();
            e.stopImmediatePropagation();

            playAudio(swipeAudio);

            const swiper = getSwiper();

            if (swiper && !swiper.isEnd) {
              swiper.slideNext();
              return;
            }

            setTimeout(() => {
              window.location.href = "pranam.html";
            }, 150);
          },
          true,
        );

        homeBtnLink?.addEventListener(
          "click",
          (e) => {
            e.preventDefault();
            e.stopImmediatePropagation();

            const homeUrl = homeBtnLink.getAttribute("href");

            playAudio(popAudio);

            setTimeout(() => {
              window.location.href = homeUrl;
            }, 300);
          },
          true,
        );

        /* ---------- reusable intro video button + popup controller ---------- */

        function formatTime(time) {
          if (!time || isNaN(time)) return "0:00";

          const minutes = Math.floor(time / 60);
          const seconds = Math.floor(time % 60);

          return `${minutes}:${seconds < 10 ? "0" : ""}${seconds}`;
        }

        function createVideoController(suffix, slideIndex) {
          const videoBtnWrap = document.getElementById(`introVideoBtn${suffix}`);
          const startVideoBtn = document.getElementById(`startVideoBtn${suffix}`);

          const videoPopup = document.getElementById(`videoPopup${suffix}`);
          const videoBox = document.getElementById(`videoBox${suffix}`);
          const closeVideoBtn = document.getElementById(`closeVideoBtn${suffix}`);
          const popupVideo = document.getElementById(`popupVideo${suffix}`);
          const popupVideoFrame = document.getElementById(`popupVideoFrame${suffix}`);

          const centerPlayBtn = document.getElementById(`centerPlayBtn${suffix}`);
          const playPauseBtn = document.getElementById(`playPauseBtn${suffix}`);
          const playPauseIcon = playPauseBtn.querySelector("i");
          const centerPlayIcon = centerPlayBtn.querySelector("i");

          const videoProgress = document.getElementById(`videoProgress${suffix}`);
          const currentTimeText = document.getElementById(`currentTime${suffix}`);
          const totalTimeText = document.getElementById(`totalTime${suffix}`);

          const muteBtn = document.getElementById(`muteBtn${suffix}`);
          const muteIcon = muteBtn.querySelector("i");
          const volumeRange = document.getElementById(`volumeRange${suffix}`);

          const fullscreenBtn = document.getElementById(`fullscreenBtn${suffix}`);
          const fullscreenIcon = fullscreenBtn.querySelector("i");

          let controlsTimer;
          let lastVolume = 1;
          let savedVideoTime = 0;
          let maxAllowedTime = 0;
          let isProgressDragging = false;

          function updatePlayIcons() {
            if (popupVideo.paused) {
              playPauseIcon.className = "fa-solid fa-play";
              centerPlayIcon.className = "fa-solid fa-play";
              centerPlayBtn.classList.remove("hide");
            } else {
              playPauseIcon.className = "fa-solid fa-pause";
              centerPlayIcon.className = "fa-solid fa-pause";
              centerPlayBtn.classList.add("hide");
            }
          }

          function updateProgress() {
            if (!popupVideo.duration) return;

            if (popupVideo.currentTime > maxAllowedTime) {
              maxAllowedTime = popupVideo.currentTime;
            }

            savedVideoTime = popupVideo.currentTime;

            if (!isProgressDragging) {
              const progressValue =
                (popupVideo.currentTime / popupVideo.duration) * 100;

              videoProgress.value = progressValue;
            }

            currentTimeText.textContent = formatTime(popupVideo.currentTime);
            totalTimeText.textContent = formatTime(popupVideo.duration);
          }

          function handleProgressInput() {
            if (!popupVideo.duration) return;

            isProgressDragging = true;

            const selectedTime =
              (Number(videoProgress.value) / 100) * popupVideo.duration;

            if (selectedTime <= maxAllowedTime) {
              currentTimeText.textContent = formatTime(selectedTime);
            } else {
              const allowedProgress = (maxAllowedTime / popupVideo.duration) * 100;

              videoProgress.value = allowedProgress;
              currentTimeText.textContent = formatTime(maxAllowedTime);
            }
          }

          function handleProgressChange() {
            if (!popupVideo.duration) return;

            const selectedTime =
              (Number(videoProgress.value) / 100) * popupVideo.duration;

            if (selectedTime <= maxAllowedTime) {
              popupVideo.currentTime = selectedTime;
              savedVideoTime = selectedTime;
            } else {
              popupVideo.currentTime = maxAllowedTime;

              const allowedProgress = (maxAllowedTime / popupVideo.duration) * 100;

              videoProgress.value = allowedProgress;
              savedVideoTime = maxAllowedTime;
            }

            isProgressDragging = false;
            updateProgress();
          }

          function updateMuteIcon() {
            if (popupVideo.muted || popupVideo.volume === 0) {
              muteIcon.className = "fa-solid fa-volume-xmark";
            } else if (popupVideo.volume < 0.5) {
              muteIcon.className = "fa-solid fa-volume-low";
            } else {
              muteIcon.className = "fa-solid fa-volume-high";
            }
          }

          function togglePlay() {
            if (!popupVideo) return;

            if (popupVideo.paused) {
              popupVideo.play().catch(function () {});
            } else {
              popupVideo.pause();
            }
          }

          function open() {
            if (!videoPopup || !popupVideo) return;

            document.body.classList.add("video-open");
            videoPopup.classList.add("active");

            // pause the background carousel video while the popup is open
            pauseAllSlideVideos();

            popupVideo.volume = Number(volumeRange.value);
            popupVideo.muted = false;

            if (savedVideoTime > 0) {
              popupVideo.currentTime = savedVideoTime;
            }

            updateMuteIcon();
            updatePlayIcons();
            updateProgress();

            setTimeout(function () {
              popupVideo.play().catch(function () {});
            }, 250);
          }

          function close() {
            if (!videoPopup || !popupVideo) return;

            savedVideoTime = popupVideo.currentTime;

            popupVideo.pause();

            videoPopup.classList.remove("active");
            document.body.classList.remove("video-open");

            if (document.fullscreenElement === videoBox) {
              document.exitFullscreen().catch(function () {});
            }

            updatePlayIcons();

            // resume the active slide's carousel video now that the popup is closed
            playActiveSlideVideo();
          }

          function toggleMute() {
            if (popupVideo.muted || popupVideo.volume === 0) {
              popupVideo.muted = false;
              popupVideo.volume = lastVolume || 1;
              volumeRange.value = popupVideo.volume;
            } else {
              lastVolume = popupVideo.volume;
              popupVideo.muted = true;
              volumeRange.value = 0;
            }

            updateMuteIcon();
          }

          function changeVolume() {
            const volumeValue = Number(volumeRange.value);

            popupVideo.volume = volumeValue;
            popupVideo.muted = volumeValue === 0;

            if (volumeValue > 0) {
              lastVolume = volumeValue;
            }

            updateMuteIcon();
          }

          function toggleFullscreen() {
            if (document.fullscreenElement !== videoBox) {
              videoBox.requestFullscreen().catch(function () {});
            } else {
              document.exitFullscreen().catch(function () {});
            }
          }

          function updateFullscreenIcon() {
            if (document.fullscreenElement === videoBox) {
              fullscreenIcon.className = "fa-solid fa-compress";
            } else {
              fullscreenIcon.className = "fa-solid fa-expand";
            }
          }

          function showControlsTemporarily() {
            popupVideoFrame.classList.remove("controls-hidden");

            clearTimeout(controlsTimer);

            if (!popupVideo.paused) {
              controlsTimer = setTimeout(function () {
                popupVideoFrame.classList.add("controls-hidden");
              }, 2200);
            }
          }

          if (startVideoBtn) {
            startVideoBtn.addEventListener("click", function () {
              playAudio(videoPlayClickSound);
              open();
            });
          }

          if (closeVideoBtn) {
            closeVideoBtn.addEventListener("click", close);
          }

          if (videoPopup) {
            videoPopup.addEventListener("click", function (e) {
              if (e.target === videoPopup) {
                close();
              }
            });
          }

          if (popupVideo) {
            popupVideo.addEventListener("click", togglePlay);
            popupVideo.addEventListener("play", updatePlayIcons);
            popupVideo.addEventListener("pause", updatePlayIcons);
            popupVideo.addEventListener("timeupdate", updateProgress);
            popupVideo.addEventListener("loadedmetadata", updateProgress);

            popupVideo.addEventListener("ended", function () {
              savedVideoTime = 0;
              maxAllowedTime = 0;
              videoProgress.value = 0;
              currentTimeText.textContent = "0:00";
              updatePlayIcons();
            });

            popupVideo.addEventListener("contextmenu", function (e) {
              e.preventDefault();
            });
          }

          if (videoProgress) {
            videoProgress.addEventListener("input", handleProgressInput);
            videoProgress.addEventListener("change", handleProgressChange);

            videoProgress.addEventListener("mousedown", function () {
              isProgressDragging = true;
            });

            videoProgress.addEventListener("mouseup", handleProgressChange);

            videoProgress.addEventListener("touchstart", function () {
              isProgressDragging = true;
            });

            videoProgress.addEventListener("touchend", handleProgressChange);
          }

          if (centerPlayBtn) {
            centerPlayBtn.addEventListener("click", togglePlay);
          }

          if (playPauseBtn) {
            playPauseBtn.addEventListener("click", togglePlay);
          }

          if (muteBtn) {
            muteBtn.addEventListener("click", toggleMute);
          }

          if (volumeRange) {
            volumeRange.addEventListener("input", changeVolume);
          }

          if (fullscreenBtn) {
            fullscreenBtn.addEventListener("click", toggleFullscreen);
          }

          if (popupVideoFrame) {
            popupVideoFrame.addEventListener("mousemove", showControlsTemporarily);
            popupVideoFrame.addEventListener("click", showControlsTemporarily);
          }

          document.addEventListener("fullscreenchange", updateFullscreenIcon);

          return {
            slideIndex,
            videoBtnWrap,
            element: videoPopup,
            open,
            close,
            togglePlay,
            toggleMute,
            toggleFullscreen,
          };
        }

        // instance 1: slide 1 (index 0), sharing_video.mp4
        const videoInstance1 = createVideoController(1, 0);

        // instance 2: slide 7 (index 6), 1.webm
        const videoInstance2 = createVideoController(2, 6);

        const videoInstances = [videoInstance1, videoInstance2];

        /* ---------- shared keyboard shortcuts (apply to whichever popup is open) ---------- */

        document.addEventListener("keydown", function (e) {
          const activeInstance = videoInstances.find((inst) =>
            inst.element.classList.contains("active"),
          );

          if (!activeInstance) return;

          if (e.key === "Escape") {
            activeInstance.close();
          }

          if (e.code === "Space") {
            e.preventDefault();
            activeInstance.togglePlay();
          }

          if (e.key.toLowerCase() === "m") {
            activeInstance.toggleMute();
          }

          if (e.key.toLowerCase() === "f") {
            activeInstance.toggleFullscreen();
          }
        });

        /* ---------- show each video button only while its own slide is active ---------- */

        function initVideoBtnVisibility() {
          const swiper = getSwiper();

          if (!swiper) {
            requestAnimationFrame(initVideoBtnVisibility);
            return;
          }

          function updateVideoBtnVisibility() {
            videoInstances.forEach((inst) => {
              if (!inst.videoBtnWrap) return;

              if (swiper.activeIndex === inst.slideIndex) {
                inst.videoBtnWrap.classList.remove("hidden");
              } else {
                inst.videoBtnWrap.classList.add("hidden");

                if (inst.element.classList.contains("active")) {
                  inst.close();
                }
              }
            });
          }

          updateVideoBtnVisibility();
          swiper.on("slideChange", updateVideoBtnVisibility);
        }

        initVideoBtnVisibility();

        /* ---------- play each slide's own video only while that slide is active/visible ---------- */

        const slideVideos = Array.from(
          document.querySelectorAll(".swiper-slide .slide-media"),
        );

        function pauseAllSlideVideos() {
          slideVideos.forEach((video) => {
            if (!video.paused) {
              video.pause();
            }
          });
        }

        function playActiveSlideVideo() {
          // don't resume a slide video while a popup is open over the blurred main content
          if (document.body.classList.contains("video-open")) return;

          const swiper = getSwiper();
          if (!swiper) return;

          const activeVideo = slideVideos[swiper.activeIndex];
          if (activeVideo) {
            activeVideo.play().catch(() => {});
          }
        }

        function initSlideVideoPlayback() {
          const swiper = getSwiper();

          if (!swiper) {
            requestAnimationFrame(initSlideVideoPlayback);
            return;
          }

          function updateSlideVideos() {
            slideVideos.forEach((video, index) => {
              if (index === swiper.activeIndex) {
                // slide just became visible — start it from the beginning
                video.currentTime = 0;

                if (!document.body.classList.contains("video-open")) {
                  video.play().catch(() => {});
                }
              } else if (!video.paused || video.currentTime !== 0) {
                // any slide that isn't visible anymore — stop and reset it
                video.pause();
                video.currentTime = 0;
              }
            });
          }

          // also pause/resume the active slide's video whenever an intro popup opens/closes
          const bodyObserver = new MutationObserver(() => {
            if (document.body.classList.contains("video-open")) {
              pauseAllSlideVideos();
            } else {
              playActiveSlideVideo();
            }
          });

          bodyObserver.observe(document.body, {
            attributes: true,
            attributeFilter: ["class"],
          });

          updateSlideVideos();
          swiper.on("slideChange", updateSlideVideos);

          // if the tab is backgrounded, pause; resume the active slide when it's foregrounded again
          document.addEventListener("visibilitychange", () => {
            if (document.hidden) {
              pauseAllSlideVideos();
            } else {
              playActiveSlideVideo();
            }
          });
        }

        initSlideVideoPlayback();
      });
    </script>
  </body>
